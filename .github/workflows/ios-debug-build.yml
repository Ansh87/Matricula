# Builds the Matricula iOS app (Debug) on GitHub's Mac machines and produces
# an unsigned .ipa you can install on your own iPhone from Windows with
# Sideloadly (which signs it with your Apple ID).
#
# Why Debug: the RevenueCat Test Store key only works in Debug builds
# (Release/TestFlight builds deliberately crash with a Test Store key).
#
# Runs only when you press "Run workflow" on GitHub (Actions tab), so it
# never uses build minutes on normal pushes. The Railway website is not
# affected by this file at all.
#
# Required GitHub secrets (Settings -> Secrets and variables -> Actions),
# same values as the Railway variables:
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID
name: iOS debug build (for Sideloadly)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 8 requires Xcode 26 or newer.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Write client/.env from GitHub secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ] || [ -z "$VITE_FIREBASE_APP_ID" ]; then
            echo "::error::Firebase secrets are missing. Add the VITE_FIREBASE_* secrets in GitHub repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          {
            echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY"
            echo "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN"
            echo "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID"
            echo "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID"
            echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID"
          } > .env

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Copy web app + plugins into the iOS project
        run: npx cap sync ios

      - name: Show Xcode version and schemes
        working-directory: client/ios/App
        run: |
          xcodebuild -version
          xcodebuild -list -project App.xcodeproj

      - name: Build iOS app (Debug, unsigned)
        working-directory: client/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        working-directory: client/ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -qry Matricula-debug.ipa Payload
          ls -lh Matricula-debug.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Matricula-debug-ipa
          path: client/ios/App/Matricula-debug.ipa
          retention-days: 7
